[supervisord]
nodaemon=false
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=100
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb_err.log

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=200
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox_err.log

[program:x11vnc]
command=x11vnc -display :1 -forever -nopw -shared -rfbport 5900
autorestart=true
priority=300
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc_err.log

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc_err.log
