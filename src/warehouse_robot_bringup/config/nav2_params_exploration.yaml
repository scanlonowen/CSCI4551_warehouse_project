# Nav2 params for the warehouse forklift, configured for LIVE-SLAM exploration.
#
# Diff vs config/nav2_params.yaml (used by the Stage 3 navigation.launch.py):
#   - REMOVED: `amcl:` block.  slam_toolbox publishes the map -> odom TF, so
#     AMCL is redundant and would fight slam_toolbox over /tf.
#   - REMOVED: `map_saver:` block.  slam_toolbox owns the live /map topic and
#     exposes its own /slam_toolbox/save_map service; we don't run nav2's
#     map_server / map_saver during exploration.
#   - ADDED: `docking_server:` block with a placeholder `simple_charging_dock`
#     plugin.  Jazzy's nav2_bringup `navigation_launch.py` includes
#     `docking_server` in its hardcoded `lifecycle_nodes` list, so if no
#     `dock_plugins` parameter is provided the lifecycle manager aborts the
#     entire bringup with "Failed to bring up all requested nodes".  We don't
#     actually dock during exploration; this block exists only to let
#     docking_server reach the active state so the rest of the stack
#     (planner_server / global_costmap, which explore_lite reads) activates.
#   - All other sections (bt_navigator, controller_server, planner_server,
#     local_costmap, global_costmap, behavior_server, smoother_server,
#     velocity_smoother, waypoint_follower, collision_monitor) are unchanged
#     from nav2_params.yaml.  In particular global_costmap.track_unknown_space
#     stays true and planner_server.GridBased.allow_unknown stays true so the
#     planner can route into unmapped areas (required for frontier exploration).
#
# Use with:
#   nav2_bringup/launch/navigation_launch.py params_file:=<this file>
# (navigation_launch.py launches controller/planner/behavior/smoother/
#  bt_navigator/waypoint_follower/velocity_smoother/collision_monitor +
#  lifecycle_manager_navigation, but NOT amcl or map_server — exactly what
#  we want when slam_toolbox is the map source.)

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_cont/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.5
      min_lookahead_dist: 0.15
      # Footprint front is now x=+2.12 m (tine tips). use_collision_detection
      # is false so RPP's internal check is off; collision_monitor handles
      # safety independently. 0.9 m gives smoother path following in aisles
      # without over-projecting past the LiDAR at x=+1.20 m.
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 1.0
      # Disabled. collision_monitor (below) already stops the robot 0.1 s
      # before any predicted collision based on the same /scan, and it
      # uses the actual published_footprint instead of a forward-projected
      # one. RPP's internal check, combined with the LiDAR-ahead-of-
      # footprint geometry, was aborting every goal explore_lite sent and
      # exploration died after 1.42 m of travel.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.5
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.0
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      rolling_window: true
      # 6×6 m: the tine tips sit at x=+2.12 m from base_footprint.
      # With a 4×4 m costmap the tips were outside the window (only 2.0 m
      # forward), so obstacles at tine range were invisible to the controller
      # and collision_monitor. 6 m gives ≈0.9 m of clear-space detection
      # beyond the tine tips.
      width: 6
      height: 6
      resolution: 0.05
      # Extended footprint includes the fork tines (raised to 1.1 m during
      # exploration). The tines extend to x=+2.12 m from base_footprint at
      # y=±0.525 m. Without this the planner only protected the chassis
      # (x=+0.80 m) and routed tine tips straight into shelf structure.
      footprint: "[[-1.00, 0.75], [-1.00, -0.75], [2.40, -0.75], [2.40, 0.75]]"
      plugins: ["voxel_layer", "inflation_layer"]
      # Local costmap inflation kept modest (0.25m): with the warehouse's
      # tight aisles and the forklift's 0.56m inscribed radius, anything
      # larger marks the entire aisle as inscribed (cost 99) and the
      # controller's collision check fires non-stop ("collision ahead!").
      # The collision_monitor with time_before_collision=0.5s still catches
      # real collisions independently.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.05
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 32
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      footprint: "[[-1.00, 0.75], [-1.00, -0.75], [2.40, -0.75], [2.40, 0.75]]"
      resolution: 0.05
      track_unknown_space: true
      # Rolling window keeps the global costmap independent of how much
      # slam_toolbox has mapped so far. Without this, the costmap
      # initially sizes to the (tiny) /map and explore_lite reports
      # "Robot out of costmap bounds" the moment the robot is more than
      # a few meters from the spawn-time map's origin.
      # 60 x 60 m comfortably encloses the 28 x 36 m big_warehouse.
      rolling_window: true
      width: 60
      height: 60
      # static_layer omitted: during live SLAM the rolling global costmap must
      # size/center itself on the robot, but static_layer overrides that.
      # inflation_layer omitted: it marks cells within the robot's inscribed
      # radius (0.57m) as cost 99, regardless of inflation_radius. In tight
      # warehouse aisles this creates a complete ring of cost-99 cells around
      # the robot's free pocket, so explore_lite's BFS can't reach the
      # free-vs-unknown boundary and reports "No frontiers found".
      # The local_costmap (4x4m, with full inflation) handles collision
      # avoidance during navigation; the collision_monitor independently
      # stops the robot if scan returns get too close. So safety is preserved
      # while keeping the global costmap usable for frontier search.
      plugins: ["obstacle_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 2000

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "/diff_cont/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 3
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Placeholder so docking_server reaches the active state during exploration.
# We never actually dock; see header comment for why this is required.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      use_battery_status: false
      use_stall_detection: false
