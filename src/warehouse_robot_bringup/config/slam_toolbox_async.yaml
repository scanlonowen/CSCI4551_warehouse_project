slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS frames / topics — match the forklift URDF and diff_cont output.
    odom_frame: odom
    map_frame: map
    # drive_base_link sits on the wheel axle midpoint, so odometry rotates
    # about the actual differential-drive center instead of the chassis frame.
    base_frame: drive_base_link
    # /scan_slam keeps a wider usable arc than /scan while still masking the
    # forklift's own mast/chassis self-hits.
    scan_topic: /scan_slam
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    # restamp_tf: true publishes map->odom TF stamped with current ROS time
    # rather than the scan's own timestamp.  With false, SLAM can publish a TF
    # whose stamp goes *backwards* when it processes a queued older scan, which
    # triggers tf2_buffer's "jump back in time" reset and causes the nav2
    # costmap obstacle_layer to drop every pending scan ("timestamp earlier than
    # all data in transform cache"). The result is a permanently-empty costmap.
    restamp_tf: true
    # LiDAR in sensors.xacro: range 0.08–12.0 m.
    min_laser_range: 0.10
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    # Lower heading threshold keeps scan matching dense during slow, manual
    # mapping turns in tight warehouse aisles.
    minimum_travel_heading: 0.08
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.65
