# Warehouse tour waypoints (in the `map` frame).
#
# After Stage 3 is running:
#   1. Launch `navigation.launch.py` and set the initial pose in RViz.
#   2. Drive to each named spot with teleop OR click a Nav2 Goal to park there.
#   3. In another terminal, read the pose:
#        ros2 topic echo --once /amcl_pose
#      and copy the x, y, and yaw into the entries below. Yaw is the Z-axis
#      rotation of the quaternion — compute with:
#        yaw = 2 * atan2(orientation.z, orientation.w)
#   4. Rebuild:  colcon build --symlink-install --packages-select warehouse_robot_bringup
#
# Edit `route` to reorder or subset the tour.

route:
  - loading_zone
  - aisle_1
  - aisle_2
  - drop_zone

waypoints:
  loading_zone:
    x: 0.0
    y: 0.0
    yaw: 0.0
  aisle_1:
    x: 3.0
    y: 0.0
    yaw: 0.0
  aisle_2:
    x: 3.0
    y: 3.0
    yaw: 1.5708
  drop_zone:
    x: 0.0
    y: 3.0
    yaw: 3.1416
