# explore_lite parameters for the warehouse forklift.
# Defaults overridden:
#   robot_base_frame: base_footprint  (matches forklift URDF and slam_toolbox)
#   costmap_topic:    /global_costmap/costmap
#                                     (Nav2's global costmap, which is
#                                      configured rolling_window 60x60 in
#                                      nav2_params_exploration.yaml so it
#                                      always encloses the robot. Subscribing
#                                      directly to slam_toolbox's /map fails
#                                      with "Robot out of costmap bounds"
#                                      because (a) the TRANSIENT_LOCAL /map
#                                      publisher does not deliver stored
#                                      messages to the VOLATILE subscriber
#                                      explore_lite uses under Cyclone DDS,
#                                      and (b) the first /map is too small
#                                      to cover the robot pose.)
#   return_to_init:   false           (we don't need the robot to drive back;
#                                      the explore.launch.py save-on-complete
#                                      hook fires as soon as no frontiers
#                                      remain)
#   min_frontier_size: 1.5            (frontiers smaller than 1.5 m are
#                                      shelf-gap noise — keeps explorer from
#                                      getting stuck in narrow rack gaps)
#   progress_timeout: 20.0            (give Nav2 20 s before blacklisting a
#                                      frontier; robot gets unstuck faster)
explore_node:
  ros__parameters:
    robot_base_frame: base_footprint
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.2
    progress_timeout: 20.0
    # m-explore-ros2's frontier cost is just
    #   potential_scale*distance - gain_scale*size  (NO orientation term —
    # it's declared in explore.cpp but never used in frontierCost()).
    # Lower gain_scale (2.0 → 1.0) keeps the robot from chasing huge
    # frontiers visible through shelving when there's open space dead
    # ahead. Higher potential_scale would prefer nearby frontiers.
    potential_scale: 0.5
    gain_scale: 3.0
    transform_tolerance: 0.5
    # Frontiers smaller than 1.5 m are shelf-gap noise in this warehouse.
    # 1.5 m filters narrow shelf-end gaps the robot can't physically navigate
    # while still targeting open aisle mouths and far-wall boundaries.
    min_frontier_size: 1.5
    return_to_init: false
